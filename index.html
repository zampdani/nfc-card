<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniele Zampini</title>

    <!-- Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #ffffff;
            font-family: "Lato", sans-serif;
            font-weight: 400;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content {
            width: min(100% - 48px, 900px);
            margin: 0 auto;
            padding: 48px 0 80px;
            flex: 1;
        }

        /* Header */

        .header {
            margin-bottom: 48px;
        }

        .name {
            margin: 0 0 10px;
            font-size: 31px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .profession {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
            font-weight: 300;
            color: #b5b5b5;
        }

        .location {
            margin: 0;
            font-size: 17px;
            line-height: 1.5;
            font-weight: 300;
            color: #b5b5b5;
        }

        /* Image */

        .hero-image {
            width: 100%;
            display: block;
            margin-bottom: 32px;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Buttons */

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .action {
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            min-height: 150px;
            padding: 24px;

            border: 1px solid #444444;
            color: #ffffff;
            text-decoration: none;

            transition: border-color 0.2s ease;
        }

        .action:hover {
            border-color: #ffffff;
        }

        .action-symbol {
            font-size: 30px;
            line-height: 1;
            font-weight: 300;
        }

        .action-title {
            margin-top: 28px;

            font-size: 17px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .action-description {
            margin-top: 6px;

            font-size: 13px;
            line-height: 1.4;
            font-weight: 300;
            color: #999999;
        }

        /* Footer */

        .footer {
            width: 100%;
            border-top: 1px solid #292929;
            padding: 22px 24px;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;
            font-weight: 400;
            color: #666666;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .content {
                width: calc(100% - 32px);
                padding-top: 40px;
                padding-bottom: 60px;
            }

            .header {
                margin-bottom: 32px;
            }

            .name {
                font-size: 26px;
            }

            .profession,
            .location {
                font-size: 16px;
            }

            .hero-image {
                margin-bottom: 24px;
            }

            .actions {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .action {
                min-height: 140px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <main class="content">

        <header class="header">

            <h1 class="name">
                DANIELE ZAMPINI
            </h1>

            <p class="profession">
                Photographer / Retoucher / Digitech
            </p>

            <p class="location">
                Italia
            </p>

        </header>


        <div class="hero-image">

            <img
                src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                alt="Still life photography by Daniele Zampini"
            >

        </div>


        <section class="actions">

            <!-- Salva contatto -->

            <a
                class="action"
                href="Daniele-Zampini.vcf"
                download
            >

                <span class="action-symbol">+</span>

                <div>

                    <div class="action-title">
                        SALVA IL CONTATTO
                    </div>

                    <div class="action-description">
                        Aggiungi i miei dati in rubrica
                    </div>

                </div>

            </a>


            <!-- Sito -->

            <a
                class="action"
                href="https://www.danielezampini.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="action-symbol">↗</span>

                <div>

                    <div class="action-title">
                        VISITA IL SITO
                    </div>

                    <div class="action-description">
                        Portfolio e progetti
                    </div>

                </div>

            </a>

        </section>

    </main>


    <footer class="footer">
        © 2026 DANIELE ZAMPINI
    </footer>

</div>

</body>
</html>
