<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniele Zampini</title>

    <!-- Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #ffffff;
            font-family: "Lato", sans-serif;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;
        }

        .content {
            width: min(960px, calc(100% - 48px));
            margin: 0 auto;

            padding: 48px 0 40px;

            flex: 1;
        }

        /* =========================
           MAIN CARD
        ========================= */

        .main-grid {
            display: grid;

            grid-template-columns: 58% 1fr;

            gap: 32px;

            align-items: stretch;
        }

        /* =========================
           IMAGE
        ========================= */

        .hero-image {
            width: 100%;

            aspect-ratio: 4 / 3;

            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        /* =========================
           IDENTITY + ACTIONS
        ========================= */

        .details {
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            min-width: 0;
        }

        .identity {
            padding-top: 2px;
        }

        .name {
            margin: 0 0 10px;

            font-size: 31px;
            line-height: 1.1;

            font-weight: 700;

            letter-spacing: 0.02em;
        }

        .profession,
        .location {
            margin: 0;

            font-size: 17px;
            line-height: 1.5;

            font-weight: 300;

            color: #b5b5b5;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: grid;

            grid-template-columns: 1fr;

            gap: 12px;
        }

        .action {
            min-height: 110px;

            padding: 20px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 1px solid #444444;

            color: #ffffff;

            text-decoration: none;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        .action:hover {
            border-color: #ffffff;
            background: #151515;
        }

        .action-symbol {
            font-size: 28px;
            line-height: 1;

            font-weight: 300;
        }

        .action-title {
            font-size: 16px;
            line-height: 1.2;

            font-weight: 700;

            letter-spacing: 0.10em;
        }

        .action-description {
            margin-top: 5px;

            font-size: 13px;
            line-height: 1.4;

            font-weight: 300;

            color: #999999;
        }

        /* =========================
           SOCIAL
        ========================= */

        .social {
            display: flex;

            justify-content: center;

            gap: 36px;

            margin-top: 28px;
        }

        .social a {
            color: #ffffff;

            text-decoration: none;

            font-size: 13px;

            line-height: 1.4;

            font-weight: 700;

            letter-spacing: 0.08em;
        }

        .social a:hover {
            text-decoration: underline;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;

            border-top: 1px solid #292929;

            padding: 20px 24px;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;

            font-weight: 400;

            color: #666666;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 700px) {

            .content {
                width: calc(100% - 32px);

                padding-top: 32px;
                padding-bottom: 28px;
            }

            .main-grid {
                grid-template-columns: 1fr;

                gap: 20px;
            }

            .details {
                display: contents;
            }

            .identity {
                order: 1;
            }

            .hero-image {
                order: 2;
            }

            .actions {
                order: 3;
            }

            .social {
                order: 4;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                min-height: 100svh;

                overflow: hidden;
            }

            .content {
                width: calc(100% - 32px);

                padding:
                    max(16px, env(safe-area-inset-top))
                    0
                    16px;
            }

            .main-grid {
                gap: 0;
            }

            .identity {
                margin-bottom: 18px;
            }

            .name {
                margin-bottom: 4px;

                font-size: clamp(23px, 7vw, 28px);
            }

            .profession,
            .location {
                font-size: 15px;

                line-height: 1.35;
            }

            /* Photo with black frame */

            .hero-image {
                width: 92%;

                margin: 0 auto 18px;

                aspect-ratio: 4 / 3;
            }

            /* CTA */

            .actions {
                gap: 10px;
            }

            .action {
                min-height: 0;

                height: clamp(86px, 12vh, 102px);

                padding: 13px 16px;
            }

            .action-symbol {
                font-size: 25px;
            }

            .action-title {
                font-size: 15px;

                letter-spacing: 0.09em;
            }

            .action-description {
                margin-top: 3px;

                font-size: 12px;
            }

            /* Social */

            .social {
                margin-top: 18px;

                gap: 28px;
            }

            .social a {
                font-size: 12px;
            }

            /* No footer on mobile */

            .footer {
                display: none;
            }
        }

        /* =========================
           SHORT MOBILE SCREENS
        ========================= */

        @media (max-width: 600px) and (max-height: 700px) {

            .content {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .identity {
                margin-bottom: 12px;
            }

            .name {
                font-size: 22px;
            }

            .profession,
            .location {
                font-size: 14px;

                line-height: 1.25;
            }

            .hero-image {
                width: 90%;

                margin-bottom: 12px;
            }

            .actions {
                gap: 8px;
            }

            .action {
                height: 76px;

                padding: 10px 14px;
            }

            .action-symbol {
                font-size: 22px;
            }

            .action-title {
                font-size: 14px;
            }

            .action-description {
                font-size: 11px;
            }

            .social {
                margin-top: 12px;

                gap: 24px;
            }

        }

    </style>
</head>

<body>

<div class="page">

    <main class="content">

        <section class="main-grid">

            <!-- FOTO -->

            <div class="hero-image">

                <img
                    src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                    alt="Still life photography by Daniele Zampini"
                >

            </div>


            <!-- DATI + CTA -->

            <div class="details">

                <div class="identity">

                    <h1 class="name">
                        DANIELE ZAMPINI
                    </h1>

                    <p class="profession">
                        Photographer / Retoucher / Digitech
                    </p>

                    <p class="location">
                        Italia
                    </p>

                </div>


                <div class="actions">

                    <!-- SALVA CONTATTO -->

                    <a
                        class="action"
                        href="Daniele-Zampini.vcf"
                        download
                    >

                        <span class="action-symbol">
                            +
                        </span>

                        <div>

                            <div class="action-title">
                                SALVA IL CONTATTO
                            </div>

                            <div class="action-description">
                                Aggiungi i miei dati in rubrica
                            </div>

                        </div>

                    </a>


                    <!-- VISITA SITO -->

                    <a
                        class="action"
                        href="https://www.danielezampini.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <span class="action-symbol">
                            ↗
                        </span>

                        <div>

                            <div class="action-title">
                                VISITA IL SITO
                            </div>

                            <div class="action-description">
                                Portfolio e progetti
                            </div>

                        </div>

                    </a>

                </div>

            </div>

        </section>


        <!-- SOCIAL -->

        <nav class="social" aria-label="Social media">

            <a
                href="https://www.instagram.com/danielezampinifotografo/"
                target="_blank"
                rel="noopener noreferrer"
            >
                INSTAGRAM
            </a>

            <a
                href="https://www.linkedin.com/in/danielezampini/"
                target="_blank"
                rel="noopener noreferrer"
            >
                LINKEDIN
            </a>

        </nav>

    </main>


    <footer class="footer">
        © 2026 DANIELE ZAMPINI
    </footer>

</div>

</body>
</html>
