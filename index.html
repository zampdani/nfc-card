<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daniele Zampini</title>

    <!-- ==================================================
         GOOGLE FONT — LATO
    ================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;
        }


        /* ==================================================
           BODY
        ================================================== */

        body {

            background: #ffffff;

            color: #111111;

            font-family: "Lato", sans-serif;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;
        }


        /* ==================================================
           PAGE
        ================================================== */

        .page {

            width: 100%;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;

            flex-direction: column;
        }


        /* ==================================================
           CONTENT
        ================================================== */

        .content {

            width: min(
                960px,
                calc(100% - 48px)
            );

            margin: 0 auto;

            padding:
                48px 0
                40px;

            flex: 1;
        }


        /* ==================================================
           DESKTOP — MAIN GRID
        ================================================== */

        .main-grid {

            display: grid;

            grid-template-columns:
                58% 1fr;

            gap: 32px;

            align-items: stretch;
        }


        /* ==================================================
           IMAGE
        ================================================== */

        .hero-image {

            width: 100%;

            aspect-ratio: 4 / 3;

            overflow: hidden;

            background: #f5f5f5;
        }

        .hero-image img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* ==================================================
           RIGHT COLUMN
        ================================================== */

        .details {

            min-width: 0;

            height: 100%;

            display: flex;

            flex-direction: column;
        }


        /* ==================================================
           IDENTITY
        ================================================== */

        .identity {

            padding-top: 0;
        }

        .name {

            margin: 0 0 7px;

            font-size: 31px;

            line-height: 1.1;

            font-weight: 700;
        }

        .profession,
        .location {

            margin: 0;

            font-size: 17px;

            line-height: 1.35;

            font-weight: 300;

            color: #666666;
        }


        /* ==================================================
           CTA CONTAINER
        ================================================== */

        .actions {

            display: grid;

            grid-template-columns: 1fr;

            gap: 32px;

            margin-top: 36px;

            margin-bottom: 32px;
        }


        /* ==================================================
           CTA
        ================================================== */

        .action {

            min-height: 96px;

            padding:
                16px 18px;

            display: grid;

            grid-template-columns:
                46px 1fr;

            column-gap: 16px;

            align-items: center;

            border: 1px solid #d0d0d0;

            background: #ffffff;

            color: #111111;

            text-decoration: none;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        .action:hover {

            border-color: #111111;

            background: #f7f7f7;
        }


        /* ==================================================
           CTA ICON
        ================================================== */

        .action-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #111111;
        }

        .action-icon svg {

            display: block;

            width: 100%;
            height: 100%;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.5;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* ==================================================
           CTA TEXT
        ================================================== */

        .action-title {

            font-size: 15px;

            line-height: 1.2;

            font-weight: 700;

            letter-spacing: 0.08em;
        }

        .action-description {

            margin-top: 4px;

            font-size: 13px;

            line-height: 1.35;

            font-weight: 300;

            color: #777777;
        }


        /* ==================================================
           SOCIAL
        ================================================== */

        .social {

            display: flex;

            justify-content: flex-end;

            gap: 28px;

            margin-top: auto;
        }

        .social a {

            color: #111111;

            text-decoration: none;

            font-size: 13px;

            line-height: 1.4;

            font-weight: 700;

            letter-spacing: 0.07em;
        }

        .social a:hover {

            text-decoration: underline;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            width: 100%;

            border-top:
                1px solid #e5e5e5;

            padding:
                20px 24px;

            text-align: center;

            font-size: 13px;

            line-height: 1.4;

            font-weight: 400;

            color: #777777;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {


            /* ----------------------------------------------
               PAGE
            ---------------------------------------------- */

            .page {

                min-height: 100svh;

                overflow: hidden;
            }


            /* ----------------------------------------------
               CONTENT
            ---------------------------------------------- */

            .content {

                width:
                    calc(100% - 32px);

                min-height: 100svh;

                padding-top:
                    max(
                        16px,
                        env(safe-area-inset-top)
                    );

                padding-bottom:
                    max(
                        16px,
                        env(safe-area-inset-bottom)
                    );
            }


            /* ----------------------------------------------
               MAIN GRID

               1. Identità
               2. Spazio + foto
               3. CTA
               4. Social
            ---------------------------------------------- */

            .main-grid {

                display: grid;

                grid-template-columns: 1fr;

                grid-template-rows:
                    auto
                    1fr
                    auto
                    auto;

                gap: 0;

                min-height:
                    calc(
                        100svh
                        -
                        max(
                            16px,
                            env(safe-area-inset-top)
                        )
                        -
                        max(
                            16px,
                            env(safe-area-inset-bottom)
                        )
                    );
            }


            /* ----------------------------------------------
               DETAILS

               Su mobile i suoi figli diventano
               direttamente elementi della grid.
            ---------------------------------------------- */

            .details {

                display: contents;

                height: auto;
            }


            /* ----------------------------------------------
               IDENTITY
            ---------------------------------------------- */

            .identity {

                grid-row: 1;

                margin: 0;

                padding: 0;
            }

            .name {

                margin:
                    0 0 5px;

                font-size:
                    clamp(
                        23px,
                        7vw,
                        28px
                    );

                line-height: 1.1;

                font-weight: 700;
            }

            .profession,
            .location {

                margin: 0;

                font-size: 15px;

                line-height: 1.35;

                font-weight: 300;

                color: #666666;
            }


            /* ----------------------------------------------
               IMAGE
            ---------------------------------------------- */

            .hero-image {

                grid-row: 2;

                align-self: center;

                justify-self: center;

                width: 88%;

                aspect-ratio: 4 / 3;

                margin: 0;

                overflow: hidden;

                background: #f5f5f5;
            }

            .hero-image img {

                display: block;

                width: 100%;
                height: 100%;

                object-fit: cover;
            }


            /* ----------------------------------------------
               CTA
            ---------------------------------------------- */

            .actions {

                grid-row: 3;

                width: 100%;

                display: grid;

                grid-template-columns: 1fr;

                gap: 9px;

                margin: 0;
            }

            .action {

                width: 100%;

                height: 88px;

                min-height: 0;

                padding:
                    12px 15px;

                display: grid;

                grid-template-columns:
                    42px 1fr;

                column-gap: 14px;

                align-items: center;
            }


            /* ----------------------------------------------
               ICON
            ---------------------------------------------- */

            .action-icon {

                width: 38px;
                height: 38px;
            }


            /* ----------------------------------------------
               CTA TEXT
            ---------------------------------------------- */

            .action-title {

                font-size: 15px;

                line-height: 1.2;

                letter-spacing: 0.07em;
            }

            .action-description {

                margin-top: 3px;

                font-size: 12px;

                line-height: 1.35;
            }


            /* ----------------------------------------------
               SOCIAL
            ---------------------------------------------- */

            .social {

                grid-row: 4;

                justify-content: center;

                gap: 28px;

                margin-top: 17px;
            }

            .social a {

                font-size: 12px;

                line-height: 1.4;
            }


            /* ----------------------------------------------
               FOOTER
            ---------------------------------------------- */

            .footer {

                display: none;
            }

        }


        /* ==================================================
           MOBILE — SCHERMI BASSI
        ================================================== */

        @media (
            max-width: 600px
        ) and (
            max-height: 700px
        ) {


            /* ----------------------------------------------
               CONTENT
            ---------------------------------------------- */

            .content {

                padding-top: 12px;

                padding-bottom: 12px;
            }


            /* ----------------------------------------------
               GRID
            ---------------------------------------------- */

            .main-grid {

                min-height:
                    calc(
                        100svh - 24px
                    );
            }


            /* ----------------------------------------------
               IDENTITY
            ---------------------------------------------- */

            .name {

                font-size: 22px;
            }

            .profession,
            .location {

                font-size: 14px;

                line-height: 1.25;
            }


            /* ----------------------------------------------
               IMAGE
            ---------------------------------------------- */

            .hero-image {

                width: 88%;
            }


            /* ----------------------------------------------
               CTA
            ---------------------------------------------- */

            .action {

                height: 76px;

                padding:
                    10px 14px;

                grid-template-columns:
                    38px 1fr;

                column-gap: 13px;
            }


            /* ----------------------------------------------
               ICON
            ---------------------------------------------- */

            .action-icon {

                width: 34px;
                height: 34px;
            }


            /* ----------------------------------------------
               CTA TEXT
            ---------------------------------------------- */

            .action-title {

                font-size: 14px;
            }

            .action-description {

                font-size: 11px;
            }


            /* ----------------------------------------------
               SOCIAL
            ---------------------------------------------- */

            .social {

                margin-top: 11px;

                gap: 24px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- ==================================================
         MAIN CONTENT
    =================================================== -->

    <main class="content">


        <section class="main-grid">


            <!-- ==========================================
                 FOTO
            =========================================== -->

            <div class="hero-image">

                <img
                    src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                    alt="Still life photography by Daniele Zampini"
                >

            </div>


            <!-- ==========================================
                 COLONNA DESTRA
            =========================================== -->

            <div class="details">


                <!-- ======================================
                     IDENTITÀ
                ======================================= -->

                <div class="identity">

                    <h1 class="name">
                        DANIELE ZAMPINI
                    </h1>

                    <p class="profession">
                        Photographer / Retoucher / Digitech
                    </p>

                    <p class="location">
                        Italia
                    </p>

                </div>


                <!-- ======================================
                     CTA
                ======================================= -->

                <div class="actions">


                    <!-- ==================================
                         SALVA CONTATTO
                    =================================== -->

                    <a
                        class="action"
                        href="Daniele-Zampini.vcf"
                        download
                    >

                        <span
                            class="action-icon"
                            aria-hidden="true"
                        >

                            <svg
                                viewBox="0 0 48 48"
                            >

                                <line
                                    x1="24"
                                    y1="8"
                                    x2="24"
                                    y2="40"
                                />

                                <line
                                    x1="8"
                                    y1="24"
                                    x2="40"
                                    y2="24"
                                />

                            </svg>

                        </span>


                        <div>

                            <div class="action-title">
                                SALVA IL CONTATTO
                            </div>

                            <div class="action-description">
                                Aggiungi i miei dati in rubrica
                            </div>

                        </div>

                    </a>


                    <!-- ==================================
                         VISITA IL SITO
                    =================================== -->

                    <a
                        class="action"
                        href="https://www.danielezampini.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <span
                            class="action-icon"
                            aria-hidden="true"
                        >

                            <svg
                                viewBox="0 0 48 48"
                            >

                                <line
                                    x1="10"
                                    y1="38"
                                    x2="38"
                                    y2="10"
                                />

                                <polyline
                                    points="20,10 38,10 38,28"
                                />

                            </svg>

                        </span>


                        <div>

                            <div class="action-title">
                                VISITA IL SITO
                            </div>

                            <div class="action-description">
                                Portfolio e progetti
                            </div>

                        </div>

                    </a>


                </div>


                <!-- ======================================
                     SOCIAL
                ======================================= -->

                <nav
                    class="social"
                    aria-label="Social media"
                >

                    <a
                        href="https://www.instagram.com/danielezampinifotografo/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        INSTAGRAM
                    </a>

                    <a
                        href="https://www.linkedin.com/in/danielezampini/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        LINKEDIN
                    </a>

                </nav>


            </div>


        </section>


    </main>


    <!-- ==================================================
         FOOTER
    =================================================== -->

    <footer class="footer">

        © 2026 DANIELE ZAMPINI

    </footer>


</div>


</body>

</html>
