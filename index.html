<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daniele Zampini</title>

    <!-- Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #111111;
            color: #ffffff;
            font-family: "Lato", sans-serif;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        .content {
            width: min(960px, calc(100% - 48px));
            margin: 0 auto;
            padding: 48px 0 60px;
            flex: 1;
        }

        /* =========================
           TOP SECTION
        ========================= */

        .intro {
            display: grid;
            grid-template-columns: 58% 1fr;
            gap: 32px;
            align-items: start;
            margin-bottom: 32px;
        }

        .hero-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            overflow: hidden;
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .identity {
            padding-top: 2px;
        }

        .name {
            margin: 0 0 10px;

            font-size: 31px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .profession,
        .location {
            margin: 0;

            font-size: 17px;
            line-height: 1.5;
            font-weight: 300;

            color: #b5b5b5;
        }

        /* =========================
           ACTIONS
        ========================= */

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .action {
            min-height: 150px;

            padding: 24px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 1px solid #444444;

            color: #ffffff;
            text-decoration: none;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        .action:hover {
            border-color: #ffffff;
            background: #151515;
        }

        .action-symbol {
            font-size: 30px;
            line-height: 1;
            font-weight: 300;
        }

        .action-title {
            font-size: 17px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .action-description {
            margin-top: 6px;

            font-size: 13px;
            line-height: 1.4;
            font-weight: 300;

            color: #999999;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;

            border-top: 1px solid #292929;

            padding: 20px 24px;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;
            font-weight: 400;

            color: #666666;
        }

        /* =========================
           TABLET
        ========================= */

        @media (max-width: 700px) {

            .content {
                width: calc(100% - 32px);
                padding-top: 32px;
                padding-bottom: 32px;
            }

            .intro {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .identity {
                order: -1;
            }

        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .page {
                min-height: 100svh;
                max-height: 100svh;
                overflow: hidden;
            }

            .content {
                width: calc(100% - 32px);

                padding:
                    max(16px, env(safe-area-inset-top))
                    0
                    16px;
            }

            .intro {
                display: flex;
                flex-direction: column;

                gap: 12px;

                margin-bottom: 16px;
            }

            .identity {
                order: -1;
            }

            .name {
                margin-bottom: 4px;

                font-size: clamp(23px, 7vw, 28px);
            }

            .profession,
            .location {
                font-size: 15px;
                line-height: 1.35;
            }

            .hero-image {
                width: 100%;
                aspect-ratio: 4 / 3;
            }

            .actions {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .action {
                min-height: 0;
                height: clamp(88px, 14vh, 112px);

                padding: 14px 16px;
            }

            .action-symbol {
                font-size: 25px;
            }

            .action-title {
                font-size: 15px;
                letter-spacing: 0.10em;
            }

            .action-description {
                margin-top: 3px;
                font-size: 12px;
            }

            .footer {
                display: none;
            }
        }

        /* =========================
           SHORT MOBILE SCREENS
        ========================= */

        @media (max-width: 600px) and (max-height: 700px) {

            .content {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .intro {
                gap: 8px;
                margin-bottom: 10px;
            }

            .name {
                font-size: 22px;
            }

            .profession,
            .location {
                font-size: 14px;
                line-height: 1.25;
            }

            .hero-image {
                aspect-ratio: 4 / 3;
            }

            .actions {
                gap: 8px;
            }

            .action {
                height: 78px;
                padding: 10px 14px;
            }

            .action-symbol {
                font-size: 22px;
            }

            .action-title {
                font-size: 14px;
            }

            .action-description {
                font-size: 11px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <main class="content">

        <!-- FOTO + IDENTITÀ -->

        <section class="intro">

            <div class="hero-image">
                <img
                    src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                    alt="Still life photography by Daniele Zampini"
                >
            </div>

            <div class="identity">

                <h1 class="name">
                    DANIELE ZAMPINI
                </h1>

                <p class="profession">
                    Photographer / Retoucher / Digitech
                </p>

                <p class="location">
                    Italia
                </p>

            </div>

        </section>


        <!-- CTA -->

        <section class="actions">

            <a
                class="action"
                href="Daniele-Zampini.vcf"
                download
            >

                <span class="action-symbol">+</span>

                <div>

                    <div class="action-title">
                        SALVA IL CONTATTO
                    </div>

                    <div class="action-description">
                        Aggiungi i miei dati in rubrica
                    </div>

                </div>

            </a>


            <a
                class="action"
                href="https://www.danielezampini.com/"
                target="_blank"
                rel="noopener noreferrer"
            >

                <span class="action-symbol">↗</span>

                <div>

                    <div class="action-title">
                        VISITA IL SITO
                    </div>

                    <div class="action-description">
                        Portfolio e progetti
                    </div>

                </div>

            </a>

        </section>

    </main>


    <footer class="footer">
        © 2026 DANIELE ZAMPINI
    </footer>

</div>

</body>
</html>
