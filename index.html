<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daniele Zampini</title>

    <!-- Lato -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* ==================================================
           BASE
        ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #111111;

            font-family: "Lato", sans-serif;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        /* ==================================================
           PAGE
        ================================================== */

        .page {
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;
        }

        .content {
            width: min(960px, calc(100% - 48px));

            margin: 0 auto;

            padding: 48px 0 40px;

            flex: 1;
        }


        /* ==================================================
           MAIN LAYOUT
        ================================================== */

        .main-grid {
            display: grid;

            grid-template-columns: 58% 1fr;

            gap: 32px;

            align-items: stretch;
        }


        /* ==================================================
           IMAGE
        ================================================== */

        .hero-image {
            width: 100%;

            aspect-ratio: 4 / 3;

            overflow: hidden;

            background: #f5f5f5;
        }

        .hero-image img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* ==================================================
           RIGHT COLUMN
        ================================================== */

        .details {
            min-width: 0;

            display: flex;
            flex-direction: column;

            height: 100%;

            justify-content: flex-start;
        }


        /* ==================================================
           IDENTITY
        ================================================== */

        .identity {
            padding-top: 0;
        }

        .name {
            margin: 0 0 7px;

            font-size: 31px;
            line-height: 1.1;

            font-weight: 700;

            letter-spacing: 0;
        }

        .profession,
        .location {
            margin: 0;

            font-size: 17px;
            line-height: 1.35;

            font-weight: 300;

            color: #666666;
        }


        /* ==================================================
           CTA
        ================================================== */

        .actions {
            display: grid;

            grid-template-columns: 1fr;

            gap: 32px;

            margin-top: 36px;
            margin-bottom: 32px;
        }

        .action {
            min-height: 96px;

            padding: 16px 18px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            border: 1px solid #d0d0d0;

            background: #ffffff;

            color: #111111;

            text-decoration: none;

            transition:
                border-color 0.2s ease,
                background-color 0.2s ease;
        }

        .action:hover {
            border-color: #111111;

            background: #f7f7f7;
        }

        .action-symbol {
            display: block;

            font-size: 25px;
            line-height: 1;

            font-weight: 300;
        }

        .action-title {
            font-size: 15px;
            line-height: 1.2;

            font-weight: 700;

            letter-spacing: 0.08em;
        }

        .action-description {
            margin-top: 4px;

            font-size: 13px;
            line-height: 1.35;

            font-weight: 300;

            color: #777777;
        }


        /* ==================================================
           SOCIAL
        ================================================== */

        .social {
            display: flex;

            justify-content: flex-end;

            gap: 28px;

            margin-top: auto;
        }

        .social a {
            color: #111111;

            text-decoration: none;

            font-size: 13px;
            line-height: 1.4;

            font-weight: 700;

            letter-spacing: 0.07em;
        }

        .social a:hover {
            text-decoration: underline;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .footer {
            width: 100%;

            border-top: 1px solid #e5e5e5;

            padding: 20px 24px;

            text-align: center;

            font-size: 13px;
            line-height: 1.4;

            font-weight: 400;

            color: #777777;
        }


        /* ==================================================
           TABLET / MOBILE
        ================================================== */

        @media (max-width: 700px) {

            .content {
                width: calc(100% - 32px);

                padding-top: 32px;
                padding-bottom: 28px;
            }

            .main-grid {
                grid-template-columns: 1fr;

                gap: 0;
            }

            .details {
                display: contents;

                height: auto;
            }

            .identity {
                order: 1;
            }

            .hero-image {
                order: 2;
            }

            .actions {
                order: 3;
            }

            .social {
                order: 4;
            }

        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            .page {
                min-height: 100svh;

                overflow: hidden;
            }

            .content {
                width: calc(100% - 32px);

                padding:
                    max(16px, env(safe-area-inset-top))
                    0
                    16px;
            }


            /* Identity */

            .identity {
                margin-bottom: 18px;
            }

            .name {
                margin-bottom: 5px;

                font-size: clamp(23px, 7vw, 28px);

                line-height: 1.1;
            }

            .profession,
            .location {
                font-size: 15px;

                line-height: 1.35;
            }


            /* Image */

            .hero-image {
                width: 90%;

                margin:
                    0 auto 18px;

                aspect-ratio: 4 / 3;
            }


            /* CTA */

            .actions {
                width: 100%;

                gap: 9px;

                margin: 0;
            }

            .action {
                min-height: 0;

                height: 88px;

                padding: 12px 15px;
            }

            .action-symbol {
                font-size: 24px;
            }

            .action-title {
                font-size: 15px;

                letter-spacing: 0.07em;
            }

            .action-description {
                font-size: 12px;

                margin-top: 3px;
            }


            /* Social */

            .social {
                justify-content: center;

                gap: 28px;

                margin-top: 17px;
            }

            .social a {
                font-size: 12px;
            }


            /* Footer */

            .footer {
                display: none;
            }

        }


        /* ==================================================
           SHORT MOBILE SCREENS
        ================================================== */

        @media (max-width: 600px) and (max-height: 700px) {

            .content {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .identity {
                margin-bottom: 11px;
            }

            .name {
                font-size: 22px;
            }

            .profession,
            .location {
                font-size: 14px;

                line-height: 1.25;
            }

            .hero-image {
                width: 88%;

                margin-bottom: 11px;
            }

            .action {
                height: 76px;

                padding: 10px 14px;
            }

            .action-symbol {
                font-size: 22px;
            }

            .action-title {
                font-size: 14px;
            }

            .action-description {
                font-size: 11px;
            }

            .social {
                margin-top: 11px;

                gap: 24px;
            }

        }

    </style>
</head>


<body>

<div class="page">


    <main class="content">


        <section class="main-grid">


            <!-- ==========================================
                 FOTO
            =========================================== -->

            <div class="hero-image">

                <img
                    src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                    alt="Still life photography by Daniele Zampini"
                >

            </div>


            <!-- ==========================================
                 COLONNA DESTRA
            =========================================== -->

            <div class="details">


                <!-- IDENTITÀ -->

                <div class="identity">

                    <h1 class="name">
                        DANIELE ZAMPINI
                    </h1>

                    <p class="profession">
                        Photographer / Retoucher / Digitech
                    </p>

                    <p class="location">
                        Italia
                    </p>

                </div>


                <!-- CTA -->

                <div class="actions">


                    <!-- SALVA CONTATTO -->

                    <a
                        class="action"
                        href="Daniele-Zampini.vcf"
                        download
                    >

                        <span class="action-symbol">
                            +
                        </span>

                        <div>

                            <div class="action-title">
                                SALVA IL CONTATTO
                            </div>

                            <div class="action-description">
                                Aggiungi i miei dati in rubrica
                            </div>

                        </div>

                    </a>


                    <!-- VISITA SITO -->

                    <a
                        class="action"
                        href="https://www.danielezampini.com/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >

                        <span class="action-symbol">
                            ↗
                        </span>

                        <div>

                            <div class="action-title">
                                VISITA IL SITO
                            </div>

                            <div class="action-description">
                                Portfolio e progetti
                            </div>

                        </div>

                    </a>


                </div>


                <!-- SOCIAL -->

                <nav
                    class="social"
                    aria-label="Social media"
                >

                    <a
                        href="https://www.instagram.com/danielezampinifotografo/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        INSTAGRAM
                    </a>

                    <a
                        href="https://www.linkedin.com/in/danielezampini/"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        LINKEDIN
                    </a>

                </nav>


            </div>

        </section>


    </main>


    <footer class="footer">
        © 2026 DANIELE ZAMPINI
    </footer>


</div>

</body>
</html>
