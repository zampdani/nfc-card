<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="Daniele Zampini — Photographer / Retoucher / Digitech"
    >

    <title>Daniele Zampini — Photographer / Retoucher / Digitech</title>

    <!-- Lato -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet"
    >


    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #ffffff;
            color: #111111;

            font-family:
                "Lato",
                Arial,
                Helvetica,
                sans-serif;

            font-weight: 400;

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* ==================================================
           PAGE
        ================================================== */

        .page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* ==================================================
           MAIN CONTENT
        ================================================== */

        .content {
            width: 100%;
            max-width: 614px;

            margin: 0 auto;

            padding-top: 30px;
            padding-bottom: 40px;

            flex: 1;
        }


        /* ==================================================
           MAIN GRID
        ================================================== */

        .main-grid {

            display: grid;

            grid-template-columns:
                360px 240px;

            column-gap: 20px;

            align-items: start;
        }


        /* ==================================================
           IMAGE
        ================================================== */

        .hero-image {

            width: 360px;
            aspect-ratio: 4 / 3;

            overflow: hidden;

            background: #f3f3f3;
        }

        .hero-image img {

            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* ==================================================
           RIGHT COLUMN
        ================================================== */

        .details {

            width: 240px;

            display: flex;
            flex-direction: column;

            min-height: 270px;
        }


        /* ==================================================
           IDENTITY
        ================================================== */

        .identity {
            margin: 0;
        }

        .name {

            margin: 0 0 5px;

            font-size: 21px;
            line-height: 1.05;

            font-weight: 700;

            letter-spacing: -0.02em;
        }

        .profession,
        .location {

            margin: 0;

            font-size: 13px;
            line-height: 1.35;

            font-weight: 300;

            color: #777777;
        }


        /* ==================================================
           CTA
        ================================================== */

        .actions {

            display: flex;
            flex-direction: column;

            gap: 20px;

            margin-top: 50px;
        }

        .action {

            width: 240px;
            height: 64px;

            border: 1px solid #d2d2d2;

            display: grid;

            grid-template-columns:
                42px 1fr;

            column-gap: 10px;

            align-items: center;

            padding: 9px 12px;

            transition:
                background-color 0.2s ease,
                border-color 0.2s ease;
        }

        .action:hover {

            background-color: #f7f7f7;

            border-color: #111111;
        }


        /* ==================================================
           CTA ICONS
        ================================================== */

        .action-icon {

            width: 36px;
            height: 36px;

            display: flex;
            align-items: center;
            justify-content: flex-start;

            color: #111111;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-weight: 300;

            line-height: 1;
        }


        /* Plus */

        .icon-plus {

            position: relative;

            width: 30px;
            height: 30px;
        }

        .icon-plus::before,
        .icon-plus::after {

            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            background: #111111;

            transform: translate(
                -50%,
                -50%
            );
        }

        .icon-plus::before {

            width: 28px;
            height: 1px;
        }

        .icon-plus::after {

            width: 1px;
            height: 28px;
        }


        /* Arrow */

        .icon-arrow {

            position: relative;

            width: 34px;
            height: 34px;
        }

        .icon-arrow::before {

            content: "";

            position: absolute;

            width: 28px;
            height: 1px;

            background: #111111;

            left: 2px;
            top: 24px;

            transform:
                rotate(-45deg);

            transform-origin:
                left center;
        }

        .icon-arrow::after {

            content: "↗";

            position: absolute;

            right: -2px;
            top: -7px;

            font-size: 31px;
            line-height: 1;

            font-weight: 300;
        }


        /* ==================================================
           CTA TEXT
        ================================================== */

        .action-text {
            min-width: 0;
        }

        .action-title {

            margin: 0;

            font-size: 13px;
            line-height: 1.15;

            font-weight: 700;

            letter-spacing: 0.045em;

            white-space: nowrap;
        }

        .action-description {

            margin: 3px 0 0;

            font-size: 10px;
            line-height: 1.2;

            font-weight: 300;

            color: #888888;
        }


        /* ==================================================
           SOCIAL
        ================================================== */

        .social {

            display: flex;

            justify-content: flex-end;

            gap: 22px;

            margin-top: auto;

            padding-top: 20px;
        }

        .social a {

            font-size: 10px;
            line-height: 1;

            font-weight: 700;

            letter-spacing: 0.045em;

            transition:
                opacity 0.2s ease;
        }

        .social a:hover {
            opacity: 0.55;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        .footer {

            width: 100%;

            border-top:
                1px solid #eeeeee;

            padding:
                10px 20px;

            text-align: center;

            color: #999999;

            font-size: 9px;

            font-weight: 400;
        }


        /* ==================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            .page {
                min-height: 100svh;
            }


            .content {

                width: 100%;

                max-width: none;

                min-height: 100svh;

                padding:
                    max(
                        22px,
                        env(safe-area-inset-top)
                    )
                    16px
                    max(
                        18px,
                        env(safe-area-inset-bottom)
                    );

                display: flex;
            }


            .main-grid {

                width: 100%;

                min-height:
                    calc(
                        100svh
                        -
                        max(
                            22px,
                            env(safe-area-inset-top)
                        )
                        -
                        max(
                            18px,
                            env(safe-area-inset-bottom)
                        )
                    );

                display: flex;

                flex-direction: column;

                column-gap: 0;
            }


            /* ==================================================
               IDENTITY
            ================================================== */

            .details {

                display: contents;
            }

            .identity {

                order: 1;

                margin: 0;

                padding: 0 12px;
            }

            .name {

                margin-bottom: 5px;

                font-size: 26px;

                line-height: 1.05;

                letter-spacing:
                    -0.025em;
            }

            .profession,
            .location {

                font-size: 16px;

                line-height: 1.35;
            }


            /* ==================================================
               IMAGE
            ================================================== */

            .hero-image {

                order: 2;

                align-self: center;

                width: 88%;

                aspect-ratio: 4 / 3;

                margin-top: 38px;

                margin-bottom: 38px;
            }


            /* ==================================================
               ACTIONS
            ================================================== */

            .actions {

                order: 3;

                width: 100%;

                display: flex;

                flex-direction: column;

                gap: 9px;

                margin: 0;
            }

            .action {

                width: 100%;

                height: 88px;

                padding:
                    12px 15px;

                grid-template-columns:
                    48px 1fr;

                column-gap: 18px;
            }


            /* ==================================================
               MOBILE ICONS
            ================================================== */

            .action-icon {

                width: 42px;
                height: 42px;
            }

            .icon-plus {

                width: 34px;
                height: 34px;
            }

            .icon-plus::before {
                width: 32px;
            }

            .icon-plus::after {
                height: 32px;
            }

            .icon-arrow {

                width: 38px;
                height: 38px;
            }

            .icon-arrow::before {

                width: 32px;

                left: 2px;
                top: 27px;
            }

            .icon-arrow::after {

                right: -2px;
                top: -8px;

                font-size: 35px;
            }


            /* ==================================================
               MOBILE CTA TEXT
            ================================================== */

            .action-title {

                font-size: 16px;

                line-height: 1.15;

                letter-spacing:
                    0.045em;
            }

            .action-description {

                margin-top: 4px;

                font-size: 12px;

                line-height: 1.3;
            }


            /* ==================================================
               SOCIAL
            ================================================== */

            .social {

                order: 4;

                width: 100%;

                justify-content: center;

                gap: 34px;

                margin-top: auto;

                padding-top: 25px;

                padding-bottom: 2px;
            }

            .social a {

                font-size: 13px;

                letter-spacing:
                    0.045em;
            }


            /* ==================================================
               FOOTER
            ================================================== */

            .footer {
                display: none;
            }
        }


        /* ==================================================
           MOBILE — SCHERMI BASSI
        ================================================== */

        @media (
            max-width: 600px
        ) and (
            max-height: 700px
        ) {

            .content {

                padding-top:
                    max(
                        16px,
                        env(safe-area-inset-top)
                    );

                padding-bottom:
                    max(
                        14px,
                        env(safe-area-inset-bottom)
                    );
            }


            .identity {
                padding: 0 10px;
            }

            .name {
                font-size: 23px;
            }

            .profession,
            .location {
                font-size: 14px;
            }


            .hero-image {

                width: 88%;

                margin-top: 28px;

                margin-bottom: 28px;
            }


            .action {

                height: 76px;

                grid-template-columns:
                    42px 1fr;

                column-gap: 16px;

                padding:
                    10px 14px;
            }


            .action-title {
                font-size: 14px;
            }

            .action-description {
                font-size: 11px;
            }


            .social {

                padding-top: 18px;

                gap: 28px;
            }

            .social a {
                font-size: 12px;
            }
        }

    </style>
</head>


<body>

    <div class="page">

        <main class="content">

            <div class="main-grid">


                <!-- ==========================================
                     FOTO
                =========================================== -->

                <div class="hero-image">

                    <img
                        src="fotografia-still-life-papillon-viola-piuma-lusso-mani-del-sud-raffaele-stella-brienza-totale.jpg"
                        alt="Still life di papillon viola e piuma"
                    >

                </div>


                <!-- ==========================================
                     COLONNA DESTRA
                =========================================== -->

                <div class="details">


                    <!-- IDENTITÀ -->

                    <div class="identity">

                        <h1 class="name">
                            DANIELE ZAMPINI
                        </h1>

                        <p class="profession">
                            Photographer / Retoucher / Digitech
                        </p>

                        <p class="location">
                            Italia
                        </p>

                    </div>


                    <!-- CTA -->

                    <div class="actions">


                        <!-- SALVA CONTATTO -->

                        <a
                            class="action"
                            href="Daniele-Zampini.vcf"
                            download
                            aria-label="Salva il contatto di Daniele Zampini"
                        >

                            <span
                                class="action-icon"
                                aria-hidden="true"
                            >
                                <span class="icon-plus"></span>
                            </span>

                            <span class="action-text">

                                <span class="action-title">
                                    SALVA IL CONTATTO
                                </span>

                                <span class="action-description">
                                    Aggiungi i miei dati in rubrica
                                </span>

                            </span>

                        </a>


                        <!-- VISITA IL SITO -->

                        <a
                            class="action"
                            href="https://www.danielezampini.com/"
                            aria-label="Visita il sito di Daniele Zampini"
                        >

                            <span
                                class="action-icon"
                                aria-hidden="true"
                            >
                                <span class="icon-arrow"></span>
                            </span>

                            <span class="action-text">

                                <span class="action-title">
                                    VISITA IL SITO
                                </span>

                                <span class="action-description">
                                    Portfolio e progetti
                                </span>

                            </span>

                        </a>

                    </div>


                    <!-- SOCIAL -->

                    <nav
                        class="social"
                        aria-label="Social"
                    >

                        <a
                            href="https://www.instagram.com/danielezampinifotografo/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            INSTAGRAM
                        </a>

                        <a
                            href="https://www.linkedin.com/in/danielezampini/"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            LINKEDIN
                        </a>

                    </nav>

                </div>

            </div>

        </main>


        <!-- ==========================================
             FOOTER
        =========================================== -->

        <footer class="footer">

            © 2026 DANIELE ZAMPINI

        </footer>

    </div>

</body>
</html>
